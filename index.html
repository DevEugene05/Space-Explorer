<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Explorer - NASA</title>
    <link rel="stylesheet" href="./Styles/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- IMAGE MODAL -->
    <div id="imageModal" class="modal hidden">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <img id="modalImage" src="" alt="NASA Image" />
        <h2 id="modalTitle"></h2>
        <p id="modalDescription"></p>
        <div id="modalExtra" class="extra-info"></div>
      </div>
    </div>

    <div class="stars"></div>
    <div class="container">
      <header>
        <h1>🚀 Space Explorer</h1>
        <p>Explore the Universe with NASA</p>

        <a href="./Coverpage.html">Home</a>
        <a href="./index.html">content</a>
      </header>

      <nav class="navigation">
        <button class="nav-btn active" data-section="search">
          NASA Library
        </button>
        <button class="nav-btn" data-section="asteroids">Asteroids</button>
      </nav>

      <!-- NASA Image Library Section -->
      <section id="search" class="content-section active">
        <h2>NASA Image & Video Library</h2>
        <div class="controls">
          <input
            type="text"
            id="searchInput"
            placeholder="Search space images..."
            value="nebula"
          />
          <button class="control-button" id="searchBtn">Search</button>
        </div>
        <div id="searchLoader" class="loader hidden"></div>
        <div id="searchResults" class="gallery"></div>
      </section>

      <!-- Asteroids Section -->
      <section id="asteroids" class="content-section">
        <h2>Near Earth Asteroids</h2>
        <div class="controls">
          <input type="date" id="asteroidDate" />
          <button class="control-button" id="asteroidBtn">
            Find Asteroids
          </button>
        </div>
        <div id="asteroidLoader" class="loader hidden"></div>
        <div id="asteroidInfo" class="asteroid-container"></div>
      </section>
    </div>

    <!-- Footer Section -->

    <footer class="footer">
      <div class="footer-content">
        <div class="footer-left">
          <h3>🚀 Space Explorer</h3>
          <p>Discover the universe — powered by NASA APIs.</p>
        </div>

        <div class="footer-links">
          <a href="#search">NASA Library</a>
          <a href="#asteroids">Asteroids</a>
          <a href="https://api.nasa.gov/" target="_blank">NASA API</a>
        </div>

        <div class="footer-right">
          <p>Connect with us:</p>
          <div class="social-icons">
            <a href="#"><i class="fa-brands fa-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-github"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
          </div>
        </div>
      </div>

      <div class="footer-bottom">
        <p>© 2025 Space Explorer | All Rights Reserved</p>
      </div>
    </footer>

    <script src="./Function/script.js"></script>
  </body>
</html>
